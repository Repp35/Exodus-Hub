name: Remove retired GitHub Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-pages.yml']
permissions:
  contents: read
  pages: write
jobs:
  remove-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          status=$(curl --silent --show-error --output /tmp/pages-response --write-out '%{http_code}' \
            --request DELETE --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/pages")
          if [ "$status" != 204 ] && [ "$status" != 404 ]; then
            cat /tmp/pages-response
            exit 1
          fi
          echo "Pages unpublished (HTTP ${status})"
