name: Format Luau
on:
  push:
    paths:
      - '**.luau'
      - 'exodus hub/indeed/formatter.py'
      - 'exodus hub/indeed/stylua.toml'
      - 'exodus hub/indeed/tests/test_formatter_*.py'
      - '.github/workflows/format-luau.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test formatter
        run: python3 -m unittest discover -s 'exodus hub/indeed/tests' -p 'test_formatter_*.py'
      - name: Format and verify Luau files
        run: |
          python3 'exodus hub/indeed/formatter.py' --in-place .
          python3 'exodus hub/indeed/formatter.py' --check .
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- '*.luau'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u -- '*.luau'
            git commit -m 'style: format Luau files'
            git push
          fi
