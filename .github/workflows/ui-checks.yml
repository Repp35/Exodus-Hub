name: Hub API checks
on:
  pull_request:
    paths:
      - 'exodus hub/**'
      - '.github/workflows/ui-checks.yml'
  push:
    branches: [main]
    paths:
      - 'exodus hub/**'
      - '.github/workflows/ui-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Luau tools
        run: |
          curl -fsSL https://github.com/luau-lang/luau/releases/download/0.748/luau-ubuntu.zip -o "$RUNNER_TEMP/luau.zip"
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/"*
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - name: Prepare discovered game catalog
        run: |
          python3 'exodus hub/indeed/tools/build_hub_catalog.py'
          python3 'exodus hub/indeed/formatter.py' --in-place 'exodus hub/hubs/catalog.luau'
      - name: Validate APIs, permissions and Luau compatibility
        run: python3 -m unittest discover -s "exodus hub/indeed/tests" -p "test_*.py"
      - name: Validate bundled icons
        run: python3 "exodus hub/indeed/tools/build_ui_icons.py" --check
      - name: Check formatting
        run: python3 "exodus hub/indeed/formatter.py" --check "exodus hub"
